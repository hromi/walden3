[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "walden-agent"
version = "0.2.0"
description = "Walden: a Matrix-native AI agent with a Sui/Walrus temporal memory graph"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Walden contributors"}]
dependencies = [
  "PyYAML>=6.0",
  "pydantic>=2.7",
  "httpx>=0.27",
  "cryptography>=43",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
matrix = ["matrix-nio[e2e]>=0.26.0"]
memwal = ["memwal"]
all = ["matrix-nio[e2e]>=0.26.0", "memwal"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7"]

[project.scripts]
walden = "walden.cli:main"

[tool.setuptools.packages.find]
include = ["walden*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
